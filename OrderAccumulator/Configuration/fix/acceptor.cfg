# FIX Acceptor (OrderAccumulator). Placeholders ${...} são resolvidos pelo FixSettingsLoader.
[DEFAULT]
ConnectionType=acceptor
NonStopSession=Y
HeartBtInt=30
UseDataDictionary=Y
DataDictionary=${DataDictionary}
FileStorePath=${StorePath}

[SESSION]
BeginString=FIX.4.4
SenderCompID=ACCUMULATOR
TargetCompID=GENERATOR
SocketAcceptPort=5001
