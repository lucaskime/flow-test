# DEV: igual ao initiator.cfg, com ResetOnLogon=Y para não travar por divergência de sequência. Não usar em produção.
[DEFAULT]
ConnectionType=initiator
NonStopSession=Y
HeartBtInt=30
ReconnectInterval=5
UseDataDictionary=Y
DataDictionary=${DataDictionary}
FileStorePath=${StorePath}
ResetOnLogon=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=GENERATOR
TargetCompID=ACCUMULATOR
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
